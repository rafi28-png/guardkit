[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "checkfirst"
version = "0.1.0"
description = "Plain-language verification for forwarded messages - Bengali and English"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
checkfirst = "checkfirst.cli:main"
