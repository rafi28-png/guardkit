[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shmpipe"
version = "0.1.0"
description = "Zero-copy shared-memory pipes for polyglot data, via Apache Arrow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyarrow>=14"]

[project.scripts]
shmpipe = "shmpipe.cli:main"
