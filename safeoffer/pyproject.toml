[project]
name = "safeoffer"
version = "0.1.0"
description = "Don't Pay Yet checker for jobs, loans, and deals - Bengali and English"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
safeoffer = "safeoffer.cli:main"
